name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# AGENTS.md's cancel-in-progress rule targets CI validation runs. A publish is
# not validation, so this workflow keeps the concurrency group but never cancels
# a running publish. A manual dispatch publishes the checked-out ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived publish
      # token and supplies the provenance attestation. No npm token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing needs npm 11.5.1 or later. node-version 24 resolves
      # to a 24.x release that bundles it. The package still supports Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          tag="$GITHUB_REF_NAME"
          if [ "$tag" != "v$version" ] && [ "$tag" != "$version" ]; then
            echo "::error::Release tag $tag does not match package.json version $version."
            exit 1
          fi
      # No install step: the command packs the `files` list and runs `prepare`,
      # whose guard exits 0 without devDependencies. Authentication is OIDC
      # trusted publishing, so the workflow reads no npm token secret. The
      # trusted publisher allows stage only, so a maintainer approves the
      # staged version with 2FA before it goes live.
      - run: npm stage publish --provenance
