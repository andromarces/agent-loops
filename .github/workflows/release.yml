name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Every CI validation workflow cancels an in-progress run of the same workflow
# and ref. A publish is not validation, so this workflow keeps the concurrency
# group but never cancels a running publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived publish
      # token and supplies the provenance attestation. No npm token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Staged publishing needs npm 11.15.0 or later. Node 24.18.0 is the first
      # 24.x release that bundles it, and a runner can cache an older 24.x, so
      # the next step checks the version. The package still supports Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm 11.15.0 or later
        shell: bash
        run: |
          npm_version="$(npm --version)"
          # Fail closed: accept only a complete MAJOR.MINOR.PATCH of digits.
          if [[ ! "$npm_version" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "::error::npm version '$npm_version' is not a stable MAJOR.MINOR.PATCH release. npm stage publish needs 11.15.0 or later."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if (( major < 11 || (major == 11 && minor < 15) )); then
            echo "::error::npm $npm_version is older than 11.15.0, which npm stage publish needs."
            exit 1
          fi
      # A release event and a manual dispatch must both run on the release tag.
      # npm records provenance from GITHUB_REF and GITHUB_SHA, so a dispatch on
      # a branch would attest the branch, not the tag.
      - name: Require the tag that matches package.json
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Run on the tag $tag. This run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
      # No install step: the command packs the `files` list and runs `prepare`,
      # whose guard exits 0 without devDependencies. Authentication is OIDC
      # trusted publishing, so the workflow reads no npm token secret. The
      # trusted publisher allows stage only, so a maintainer approves the
      # staged version with 2FA before it goes live.
      - run: npm stage publish --provenance
