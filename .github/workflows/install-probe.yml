name: Install probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Verify the published package on the minimum supported Node version.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      # pnpm refuses a global install until its bin directory is on PATH. Node
      # builds the native path, so this works on Windows and POSIX alike. The
      # runner context is unavailable in a job-level env, so publish it here.
      - name: Put the pnpm global bin directory on PATH
        run: node -e "const fs=require('fs'),p=require('path');const h=p.join(process.env.RUNNER_TEMP,'pnpm-global');const b=p.join(h,'bin');fs.mkdirSync(b,{recursive:true});fs.appendFileSync(process.env.GITHUB_ENV,'PNPM_HOME='+h+'\n');fs.appendFileSync(process.env.GITHUB_PATH,b+'\n')"
      # Run the no-install checks before any install. npx and pnpm dlx reuse an
      # installed package, so an install step would hide a broken download.
      # bash runs with -e and pipefail on every runner, so a command that fails
      # in the middle of a step fails the step. pwsh only fails on the last
      # command, which is why these steps pin the shell to bash.
      - name: Run without installing (fresh registry download)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes @andromarces/agent-loops --help
          pnpm dlx @andromarces/agent-loops --help
      - name: Install globally with npm and run from a clean directory
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g @andromarces/agent-loops
          agent-loop --help
          agent-loops --help
      # Exercise install and uninstall against a temp home, so the render path
      # and the manifest round trip are covered on macOS, Ubuntu, and Windows.
      - name: Install then uninstall harness integrations into a temp home
        shell: bash
        run: |
          export AGENT_LOOP_HOME="$(mktemp -d)"
          agent-loop install --harness claude,codex,opencode,copilot,antigravity --yes
          agent-loop install --harness claude,codex,opencode,copilot,antigravity --yes
          agent-loop uninstall --yes
          if [ -n "$(ls -A "$AGENT_LOOP_HOME")" ]; then
            echo "::error::install/uninstall left files behind"
            ls -A "$AGENT_LOOP_HOME"
            exit 1
          fi
      # bash resolves the extensionless sh shim on Windows, so check the
      # PowerShell and cmd shims explicitly. Each command carries its own exit
      # check, because pwsh does not fail a step on a middle command.
      - name: Run the npm-installed bin from PowerShell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          agent-loop --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent-loops --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run the npm-installed bin from cmd on Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: agent-loop --help
      - name: Install globally with pnpm and run from a clean directory
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          # Remove npm's copy so the only agent-loop on PATH is pnpm's. Without
          # this, npm's bin answers even if pnpm failed to link its own.
          npm uninstall -g @andromarces/agent-loops
          pnpm add -g @andromarces/agent-loops
          pnpm bin -g
          agent-loop --help
          agent-loops --help
      - name: Run the pnpm-installed bin from PowerShell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          agent-loop --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent-loops --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run the pnpm-installed bin from cmd on Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: agent-loop --help
