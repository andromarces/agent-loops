version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    rebase-strategy: auto
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    rebase-strategy: auto
