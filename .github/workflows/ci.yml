name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No setup-node cache: pnpm. The store's virtual links directory restores
      # with broken ACLs on Windows, making the next install fail with
      # "Access is denied (os error 5)" deterministically (#38). Retry cannot
      # recover from it because the restored store stays corrupt.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # pnpm#14407: on Windows, Defender/indexer transiently locks store paths
      # during install; retry instead of failing the job on the first lock hit.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "::warning::pnpm install failed (attempt $attempt/3) - retrying in 15s"
            sleep 15
          done
          exit 1
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
      # Exercise install and uninstall against the PR checkout on every runner,
      # so macOS gets installer evidence before merge, not only after a release.
      - name: Install then uninstall harness integrations into a temp home
        shell: bash
        run: |
          export AGENT_LOOP_HOME="$(mktemp -d)"
          node ./src/cli.mjs install --harness claude,codex,opencode,copilot,antigravity --yes
          node ./src/cli.mjs install --harness claude,codex,opencode,copilot,antigravity --yes
          node ./src/cli.mjs uninstall --yes
          if [ -n "$(ls -A "$AGENT_LOOP_HOME")" ]; then
            echo "::error::install/uninstall left files behind"
            ls -A "$AGENT_LOOP_HOME"
            exit 1
          fi
