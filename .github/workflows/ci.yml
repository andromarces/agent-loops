name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # pnpm#14407: on Windows, Defender/indexer transiently locks store paths
      # during install; retry instead of failing the job on the first lock hit.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "::warning::pnpm install failed (attempt $attempt/3) - retrying in 15s"
            sleep 15
          done
          exit 1
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
