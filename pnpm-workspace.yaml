# Share one virtual store across projects on this machine.
virtualStoreType: global

# Route the Vite and Vitest copies that Vite+ uses to one version each. The
# vitest pin must match the Vitest that vite-plus bundles (`vp --version`).
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
